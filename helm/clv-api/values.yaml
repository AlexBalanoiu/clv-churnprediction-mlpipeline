replicaCount: 1

image:
  repository: ghcr.io/alexbalanoiu/clv-churnprediction-mlpipeline
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

ingress:
  enabled: false
  className: traefik
  host: clv-api.local
  path: /
