# Config statică (nu Prometheus Operator) — un singur job, "kubernetes-pods",
# care descoperă TOATE pod-urile din cluster prin API-ul k8s, apoi le
# filtrează prin relabel_configs păstrând doar cele cu adnotarea
# prometheus.io/scrape: "true". Așa nu trebuie să scriem manual un target
# nou de fiecare dată când adăugăm un serviciu — punem adnotarea pe pod
# și Prometheus îl găsește singur la următorul scrape.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # păstrează doar pod-urile cu adnotarea prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # dacă adnotarea prometheus_io_path există, folosește-o ca path
          # (default e /metrics dacă nu e setată)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # dacă adnotarea prometheus_io_port există, suprascrie portul de scrape
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # etichete utile pentru filtrare ulterioară în Grafana/PromQL
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name